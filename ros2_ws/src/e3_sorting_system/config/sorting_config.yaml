    feedback_delay: 0.4
    group_name: mecharm_arm
    ik_link_name: grasp_attach_link
    frame_id: world
    ik_service: /compute_ik
    ik_avoid_collisions: false
    ik_seed_max_distance: 1.0
    grid_1.pick_joints: [0.724953, 0.819108, -0.589521, -0.000043, 1.337840, 0.734401]
    grid_2.pick_joints: [0.6010395155, 1.1610209601, -1.2097142381,
